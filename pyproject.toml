[project]
name = "hass-traeger"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = [
    "aiointercept>=0.1.9",
    "async-timeout>=5.0.1",
    "colorlog>=6.7.0",
    "coverage-badge>=1.1.2",
    "gazetteer-matcher==1.1.0",
    "ha-ffmpeg==3.2.2",
    "hassil==3.12.1",
    "homeassistant>=2026.11.0",
    "mutagen==1.48.1",
    "pip>=21.0",
    "pycares>=5.0",
    "pylint>=4.0.0",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "pytest-homeassistant>=2026.11.0",
    "pyturbojpeg==1.8.3",
    "ruff>=0.15.2",
    "setuptools<82.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
