name: Pytest

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * 6"
  push:
    branches:
      - "master"
      - "dev"
  pull_request:
    branches:
      - "master"
      - "dev"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg libturbojpeg0-dev libpcap-dev mosquitto
    - name: Create Certs & Run Mosquitto
      run: |
        openssl req -x509 -out tests/broker.crt -keyout tests/broker.key \
          -newkey rsa:2048 -nodes -sha256 \
          -subj '/CN=localhost' -extensions EXT -config <( \
          printf '[dn]\nCN=localhost\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:localhost\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth')
        mosquitto -c tests/broker.cfg &
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -r requirements.txt
        pip install --upgrade -r requirements_ha.txt
    - name: Test with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest
    - name: Stop Mosquitto
      run: |
        sudo pkill mosquitto
